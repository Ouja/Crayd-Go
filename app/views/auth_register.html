<h2>Register</h2>
<form method="post" action="/auth/register">
  {{ $.csrf.Field }}
  <p><label>Email <input name="email" type="email" autocomplete="username" value="{{ index .form "email" }}" required></label>
    {{ with .errors.email }}<small class="error">{{ . }}</small>{{ end }}</p>
  <p><label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
    {{ with .errors.password }}<small class="error">{{ . }}</small>{{ end }}</p>
  <button>Create account</button>
</form>
